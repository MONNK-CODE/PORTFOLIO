<div class="contact-container">
    <h1>Contact Me</h1>

    <div class="contact-links">
        <a href="https://www.linkedin.com/in/muhaisolatundun/" target="_blank" class="contact-btn linkedin">
            <i class="fab fa-linkedin"></i>
            <span>Muhais Olatundun</span>
        </a>

        <!-- Email Button with Copy Icon Inside -->
        <a href="mailto:monnk101@gmail.com" class="contact-btn email">
            <i class="fas fa-envelope"></i>
            <span>monnk101@gmail.com</span>
            <!-- The copy icon -->
            <i class="fas fa-copy copy-icon" onclick="copyEmail(event)" title="Copy Email"></i>
        </a>

        <script>
            function copyEmail(event) {
                event.preventDefault();
                event.stopPropagation();

                const email = "monnk101@gmail.com";
                const icon = event.target;

                navigator.clipboard.writeText(email).then(() => {
                    icon.classList.remove('fa-copy');
                    icon.classList.add('fa-check');

                    setTimeout(() => {
                        icon.classList.remove('fa-check');
                        icon.classList.add('fa-copy');
                    }, 2000);
                });
            }
        </script>

        <style>
            /* Copy Icon Styles */
            .copy-icon {
                position: absolute;
                right: 20px;
                font-size: 1.2rem !important; /* Slightly smaller than the main envelope icon */
                cursor: pointer;
                transition: transform 0.2s ease, color 0.2s ease;
                z-index: 10; /* Ensures it stays clickable above the button background */
            }

            /* Add a fun little hover effect for the icon */
            .copy-icon:hover {
                transform: scale(1.2);
                color: #ffffff;
            }

            @media (max-width: 768px) {
                .copy-icon {
                    right: 15px;
                }
            }
        </style>
