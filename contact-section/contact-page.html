            <i class="fab fa-linkedin"></i>

<!--Email Copy-->
        <div class="email-container">
            <a href="mailto:monnk101@gmail.com" class="contact-btn email">
                <i class="fas fa-envelope"></i>
                <span>monnk101@gmail.com</span>
            </a>

            <button class="copy-btn" onclick="copyEmail(event)">
                <i class="fas fa-copy"></i> Copy
            </button>
        </div>



        <script>
            function copyEmail(event) {
                event.preventDefault();
                event.stopPropagation();

                const email = "monnk101@gmail.com";
                const btn = event.currentTarget;
                const icon = btn.querySelector('i');

                navigator.clipboard.writeText(email).then(() => {
                    icon.classList.remove('fa-copy');
                    icon.classList.add('fa-check');

                    setTimeout(() => {
                        icon.classList.remove('fa-check');
                        icon.classList.add('fa-copy');
                    }, 2000);
                });
            }
        </script>

        <style>
            /* Use flexbox to stack the email button and the copy button vertically */
            .email-container {
                display: flex;
                flex-direction: column;
                align-items: center; /* Centers the copy button under the email */
                gap: 8px; /* Adds space between the email button and copy button */
                margin-top: 15px;
            }

            /* Copy Button Styles */
            .copy-btn {
                font-size: 0.9rem; /* Slightly smaller text for secondary action */
                cursor: pointer;
                transition: transform 0.2s ease, color 0.2s ease;

                /* Button Resets */
                background: transparent;
                border: none;
                outline: none;
                color: inherit;
                padding: 5px 10px; /* Small padding makes it easier to tap */
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .copy-btn:hover {
                transform: scale(1.1);
                color: #ffffff; /* Change this to your preferred hover color */
            }
        </style>
