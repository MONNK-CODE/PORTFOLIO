<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Background Bubble Animation</title>
    <style>
        .Background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: -1; /* Ensures it stays behind your main content */
        }

        /* Base styles for all bubbles */
        .bubble {
            position: absolute;
            bottom: -150px;
            background: rgba(0, 86, 179, 0.15); /* Soft blue tint based on your old border color */
            border: 1px solid rgba(0, 86, 179, 0.3);
            border-radius: 50%; /* Makes them circles */
            animation: rise 15s infinite ease-in;
        }

        /* Mix up the colors slightly for visual interest */
        .bubble:nth-child(even) {
            background: rgba(24, 25, 27, 0.1); /* Darker tint from your old secondary color */
            border-color: rgba(24, 25, 27, 0.2);
        }

        /* Individual sizes, positions, and animation timings */
        .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; }
        .bubble:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-duration: 10s; animation-delay: 1s; }
        .bubble:nth-child(3) { left: 25%; width: 20px; height: 20px; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 12s; animation-delay: 0s; }
        .bubble:nth-child(5) { left: 70%; width: 30px; height: 30px; animation-duration: 9s; animation-delay: 3s; }
        .bubble:nth-child(6) { left: 80%; width: 100px; height: 100px; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(7) { left: 32%; width: 50px; height: 50px; animation-duration: 11s; animation-delay: 5s; }
        .bubble:nth-child(8) { left: 55%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 2s; }
        .bubble:nth-child(9) { left: 25%; width: 15px; height: 15px; animation-duration: 8s; animation-delay: 4s; }
        .bubble:nth-child(10){ left: 90%; width: 70px; height: 70px; animation-duration: 13s; animation-delay: 0s; }

        /* The animation keyframes */
        @-webkit-keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Pushes them up 1000px and slightly to the right for a natural drift */
                transform: translateY(-1200px) translateX(200px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<!-- BACKGROUND ANIMATION -->
<div class="Background-animation">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>
<!-- BACKGROUND ANIMATION END -->

</div>
</body>
</html>
