<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build With Me – Muhais</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Outfit', sans-serif;
            padding: 40px 20px;
        }
        .build-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #9e0000;
            font-size: 2.2rem;
        }
        ul.project-status {
            list-style: none;
            margin-top: 40px;
            padding-left: 0;
        }
        ul.project-status li {
            margin-bottom: 20px;
            border-left: 3px solid #9e0000;
            padding-left: 15px;
            position: relative;
        }
        ul.project-status li::before {
            content: '\2022';
            position: absolute;
            left: -13px;
            color: #9e0000;
            font-size: 1.2rem;
        }
        .label {
            font-weight: bold;
        }
        .status {
            font-style: italic;
            font-size: 0.9rem;
            color: #bbb;
        }
    </style>
</head>
<body>
<div class="build-container">
    <h1>Build With Me</h1>
    <ul class="project-status">
        <li>
            <span class="label">Milestone Timeline</span><br/>
            <span class="status">✅ Completed</span>
        </li>
        <li>
            <span class="label">Build With Me Dashboard</span><br/>
            <span class="status">✅ Completed</span>
        </li>
        <li>
            <span class="label">TikTok Follower Tracker</span><br/>
            <span class="status">❌ Scrapped</span>
        </li>
        <li>
            <span class="label">Project Bounties Voting</span><br/>
            <span class="status">🟡 In Progress</span>
        </li>
        <li>
            <span class="label">Firebase Voting Upgrade</span><br/>
            <span class="status">🔲 Planned</span>
        </li>
    </ul>
</div>
</body>
</html>
