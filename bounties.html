<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Bounties – Muhais</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .bounties-section {
      max-width: 800px;
      margin: 0 auto;
    }
    .bounties-title {
      color: #9e0000;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .bounty-item {
      background-color: #1c1c1c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .vote-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .vote-button {
      cursor: pointer;
      color: #fff;
      background-color: #2a2a2a;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    #loading {
      text-align: center;
      font-size: 1rem;
      color: #ccc;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<section id="bounty-form">
  <h3>Suggest a Project Idea</h3>
  <p style="color: #ccc;">Use this form to submit new bounty ideas. If accepted, they’ll appear below for voting.</p>
  <div style="margin-top: 20px;">
    <!-- Embed Here -->
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeflF1UAmYFgq4Jhy-q3qzw_WvO2rbcjvgrTNmMCw363KPF-w/viewform?embedded=true" width="640" height="554" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </div>
</section>


<div class="bounties-section" id="bounty-section">
  <h3 class="bounties-title">🧩 Project Bounties - Vote for My Next Build!</h3>
  <p style="color: #cccccc; margin-bottom: 20px;">
    Help me decide what to build next by voting on these ideas:
  </p>
  <div id="loading">Loading bounties...</div>
  <div id="bounties-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCFfXxB6ZKSUUkw6i1knjKudk48sWwd3f8",
    authDomain: "muhais-bounties.firebaseapp.com",
    databaseURL: "https://muhais-bounties-default-rtdb.firebaseio.com",
    projectId: "muhais-bounties",
    storageBucket: "muhais-bounties.firebasestorage.app",
    messagingSenderId: "454566960560",
    appId: "1:454566960560:web:5ac7db55d66be8c02a0a75",
    measurementId: "G-XXN6VTEB32"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const bountyList = document.getElementById("bounties-list");
  const loadingText = document.getElementById("loading");

  db.ref("bounties").on("value", (snapshot) => {
    const bounties = snapshot.val();
    bountyList.innerHTML = "";
    loadingText.style.display = "none";
    if (!bounties) return;

    const sorted = Object.entries(bounties).sort((a, b) => (b[1].votes || 0) - (a[1].votes || 0));
    sorted.forEach(([id, bounty]) => {
      const item = document.createElement("div");
      item.className = "bounty-item";

      const left = document.createElement("div");
      left.innerHTML = `
          <strong>${bounty.title}</strong>
          <p style="margin: 5px 0; color: #cccccc;">${bounty.description}</p>
        `;

      const voteBox = document.createElement("div");
      voteBox.className = "vote-buttons";

      const up = document.createElement("div");
      up.className = "vote-button";
      up.innerHTML = `<i class="fas fa-thumbs-up"></i> ${bounty.votes || 0}`;
      up.onclick = () => {
        const newVoteCount = (bounty.votes || 0) + 1;

        db.ref(`bounties/${id}/votes`).set(newVoteCount);

        // Send email if this is the 10th vote
        if (newVoteCount >= 10 && !bounty.notified) {
          fetch("/api/notify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              title: bounty.title,
              description: bounty.description,
              votes: newVoteCount,
            }),
          });
        }
      };

      const down = document.createElement("div");
      down.className = "vote-button";
      down.innerHTML = `<i class="fas fa-thumbs-down"></i> ${bounty.dislikes || 0}`;
      down.onclick = () => {
        db.ref(`bounties/${id}/dislikes`).set((bounty.dislikes || 0) + 1);
      };

      voteBox.appendChild(up);
      voteBox.appendChild(down);

      item.appendChild(left);
      item.appendChild(voteBox);
      bountyList.appendChild(item);
    });
  });

</script>
</body>
</html>
